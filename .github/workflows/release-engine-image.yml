name: Release Engine Image

on:
  push:
    tags:
      - "engine-image-v*.*.*"

concurrency:
  group: engine-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/airalogy-engine/check-image-release.mjs --tag "$RELEASE_TAG"
          version=$(tr -d '\r\n' < packages/runtime/airalogy-engine-image/VERSION)
          created=$(git show -s --format=%cI "$GITHUB_SHA")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-architecture candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/runtime/airalogy-engine-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/airalogy/airalogy-engine:candidate-${{ github.sha }}
          build-args: |
            ENGINE_IMAGE_VERSION=${{ steps.release.outputs.version }}
            AIRALOGY_CORE_VERSION=${{ steps.release.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.release.outputs.created }}
          cache-from: type=gha,scope=airalogy-engine-image
          cache-to: type=gha,mode=max,scope=airalogy-engine-image
          sbom: true
          provenance: mode=max

      - name: Smoke test amd64 and arm64 images
        env:
          IMAGE: ghcr.io/airalogy/airalogy-engine@${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          manifest=$(docker buildx imagetools inspect "$IMAGE" --raw)
          for architecture in amd64 arm64; do
            platform="linux/$architecture"
            platform_digest=$(jq -r \
              --arg architecture "$architecture" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest' \
              <<< "$manifest")
            test -n "$platform_digest"
            docker run --rm --platform "$platform" \
              --env EXPECTED_VERSION \
              "ghcr.io/airalogy/airalogy-engine@$platform_digest" \
              python -c 'import importlib.metadata as m; import os; import numpy; import pandas; assert m.version("airalogy") == os.environ["EXPECTED_VERSION"]'
          done

      - name: Promote verified immutable tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          short_sha=${GITHUB_SHA::12}
          docker buildx imagetools create \
            --tag "ghcr.io/airalogy/airalogy-engine:$VERSION" \
            --tag "ghcr.io/airalogy/airalogy-engine:sha-$short_sha" \
            --tag ghcr.io/airalogy/airalogy-engine:latest \
            "ghcr.io/airalogy/airalogy-engine@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/airalogy/airalogy-engine
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create release manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg image "ghcr.io/airalogy/airalogy-engine:$VERSION@$DIGEST" \
            --arg digest "$DIGEST" \
            '{schema_version: 1, product: "Airalogy Engine Image", version: $version, release_tag: $tag, git_commit: $commit, image: $image, digest: $digest, platforms: ["linux/amd64", "linux/arm64"]}' \
            > airalogy-engine-image-release.json
          sha256sum airalogy-engine-image-release.json > airalogy-engine-image-release.json.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            airalogy-engine-image-release.json \
            airalogy-engine-image-release.json.sha256 \
            --verify-tag \
            --title "Airalogy Engine Image $VERSION" \
            --notes "Multi-architecture Airalogy Engine sandbox image for linux/amd64 and linux/arm64. Deploy by immutable digest from the attached manifest."
